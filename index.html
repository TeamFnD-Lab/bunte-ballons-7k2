<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Für Tami</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@300;400;600&family=Cormorant+Garamond:ital,wght@0,400;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#111;
    --paper:#fff;
    --muted:#8a8a8a;
    --display:"Antonio","Oswald","Arial Narrow",Impact,sans-serif;
    --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--serif);
    overflow:hidden;
    -webkit-user-select:none;user-select:none;
  }
  #stage{position:fixed;inset:0}
  #fx{position:fixed;inset:0;pointer-events:none;z-index:30}

  /* Fortschritts-Ring oben (Anspielung aufs Logo) */
  .hud{
    position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;
    transform:translateX(-50%);z-index:5;opacity:0;transition:opacity .8s;
  }
  .hud.show{opacity:1}
  .hud line{stroke:#e2e2e2;transition:stroke .5s,stroke-width .3s}
  .hud line.on{stroke:var(--c)}

  /* Ballons */
  .b{
    position:absolute;transform:translate(-50%,-50%);
    border:0;background:none;padding:0;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    animation:rise 1.8s cubic-bezier(.2,.8,.2,1) both;
    animation-delay:var(--d);
  }
  .b i{
    display:block;position:relative;
    width:var(--s);height:calc(var(--s)*1.22);
    border-radius:50% 50% 48% 48%/58% 58% 42% 42%;
    background:
      radial-gradient(circle at 30% 26%,rgba(255,255,255,.7) 0 7%,transparent 21%),
      var(--c);
    box-shadow:inset -8px -12px 20px rgba(0,0,0,.14);
    transform-origin:50% 130%;
    animation:bob 4.2s ease-in-out infinite;
    animation-delay:var(--bd);
    transition:scale .2s;
  }
  .b i::before{ /* Schnur */
    content:"";position:absolute;left:50%;top:100%;
    width:1px;height:calc(var(--s)*.85);
    background:linear-gradient(rgba(0,0,0,.35),transparent);
  }
  .b i::after{ /* Knoten */
    content:"";position:absolute;left:50%;bottom:-7px;
    width:11px;height:9px;background:var(--c);
    transform:translateX(-50%);
    clip-path:polygon(50% 0,100% 100%,0 100%);
  }
  .b:hover i{scale:1.07}
  .b:active i{scale:.96}
  .b:focus-visible{outline:2px dashed var(--ink);outline-offset:10px;border-radius:50%}
  @keyframes rise{from{transform:translate(-50%,130vh)}to{transform:translate(-50%,-50%)}}
  @keyframes bob{
    0%,100%{transform:rotate(-3.5deg) translateY(0)}
    50%{transform:rotate(3.5deg) translateY(-12px)}
  }

  /* Intro */
  .overlay{
    position:fixed;inset:0;z-index:20;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px;
    background:rgba(255,255,255,.96);
    transition:opacity .9s,visibility .9s;
  }
  .overlay.hide{opacity:0;visibility:hidden;pointer-events:none}
  h1{
    font-family:var(--display);font-weight:300;text-transform:uppercase;
    letter-spacing:.12em;line-height:1.02;margin:18px 0 10px;
    font-size:clamp(44px,12vw,104px);
  }
  .lead{
    font-style:italic;font-size:clamp(20px,3.6vw,28px);
    max-width:26ch;margin:0 auto 30px;line-height:1.3;color:#333;
  }
  .btn{
    font-family:var(--display);text-transform:uppercase;letter-spacing:.22em;
    font-size:16px;padding:15px 34px;border:1.5px solid var(--ink);
    background:var(--ink);color:#fff;border-radius:999px;cursor:pointer;
    transition:background .25s,color .25s,transform .2s;
  }
  .btn:hover{background:#fff;color:var(--ink)}
  .btn:active{transform:scale(.97)}
  .btn.ghost{background:transparent;color:var(--ink);border-color:#c9c9c9;font-size:13px;padding:11px 24px}
  .btn.ghost:hover{border-color:var(--ink)}

  /* Spruch */
  #msg{
    position:fixed;left:0;right:0;bottom:calc(7vh + env(safe-area-inset-bottom));
    z-index:6;text-align:center;padding:0 24px;pointer-events:none;
  }
  #msg .dash{display:block;width:34px;height:4px;border-radius:4px;margin:0 auto 14px;background:var(--c,#111)}
  #msg p{
    margin:0 auto;max-width:24ch;
    font-style:italic;font-size:clamp(24px,4.6vw,38px);line-height:1.22;
  }
  #msg.in{animation:fadeup .6s cubic-bezier(.2,.8,.2,1) both}
  #hint{
    position:fixed;left:0;right:0;bottom:calc(7vh + env(safe-area-inset-bottom));
    text-align:center;z-index:5;color:var(--muted);
    font-family:var(--display);letter-spacing:.24em;text-transform:uppercase;font-size:13px;
    transition:opacity .5s;
  }
  @keyframes fadeup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  /* Finale */
  #finale{background:rgba(255,255,255,.93);cursor:pointer}
  #finale .ringbig{animation:spin 50s linear infinite}
  #finale .ringbig line{stroke:var(--c);opacity:0;animation:dashin .6s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--k)*110ms + 200ms)}
  #finale .fin{opacity:0;animation:fadeup .9s cubic-bezier(.2,.8,.2,1) forwards}
  #finale .small{font-style:italic;font-size:clamp(20px,3.4vw,28px);margin:0 0 6px;color:#333}
  #finale .tri{
    font-family:var(--display);letter-spacing:.3em;text-transform:uppercase;
    font-size:clamp(15px,2.6vw,20px);margin:6px 0 28px;color:var(--muted)
  }
  #finale h1{margin:0 0 14px;font-size:clamp(38px,10vw,92px)}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes dashin{from{opacity:0}to{opacity:1}}

  @media (prefers-reduced-motion:reduce){
    .b i,#finale .ringbig{animation:none}
  }
</style>
</head>
<body>

<div id="stage"></div>
<canvas id="fx"></canvas>
<div class="hud" id="hud"></div>
<div id="hint"></div>
<div id="msg" aria-live="polite"></div>

<!-- Intro -->
<div class="overlay" id="intro">
  <div id="introRing"></div>
  <h1>Hey Tami.</h1>
  <p class="lead">Da oben schweben ein paar Ballons. In jedem steckt ein Satz für dich.</p>
  <button class="btn" id="start">Los geht's</button>
</div>

<!-- Finale -->
<div class="overlay hide" id="finale">
  <div class="fin" style="animation-delay:.1s" id="finRing"></div>
  <p class="small fin" style="animation-delay:.9s">Alles Gute zum Geburtstag,</p>
  <h1 class="fin" style="animation-delay:1.1s">Tami!</h1>
  <div class="tri fin" style="animation-delay:1.5s">Herrlich · Ehrlich · Herzlich</div>
  <p class="small fin" style="animation-delay:1.9s">Auf alles, was wir noch gemeinsam bauen.</p>
  <button class="btn ghost fin" style="animation-delay:2.4s;margin-top:22px" id="again">Nochmal von vorn</button>
</div>

<script>
/* ============ Hier kannst du die Sätze ändern ============ */
const NAME = "Tami";
const WORDS = [
  "Du bringst Farbe in alles, was du anfasst.",
  "Herrlich ehrlich: Bei dir weiß ich immer, woran ich bin.",
  "Danke, dass du weiterhin viel Freude an den kleinen Dingen unseres Alltags hast.",
  "Du machst aus Zusammenarbeit etwas Herzliches.",
  "Auf alle Ideen, auf die viele schöne Augenblicke, die noch kommen. Und auf die verrückten sowieso.",
  "Auf die Tage, an denen es brannte und wir trotzdem gelacht haben.",
  "Glückwunsch, du Herzensmensch. Für dich heute nur das Schönste. Du darfst dich weiterentwickeln, aber bleib bitte ja genau so, wie du bist.",
  "Zwei Gründerinnen, ein Plan, unendlich viele Farben.",
  "Du bereicherst mein Leben mit deinem Lächeln und deinem großen Herz. Alles Liebe zum Geburtstag!",
  "Ich wünsche dir 365 Tage Freude, Gesundheit und Zufriedenheit für dein neues Lebensjahr.",
  "Möge das neue Jahr dir genau das bringen, was du dir selbst wünschst."
];
const N = WORDS.length;
/* Farben aus dem colourgraphie-Logo, im Uhrzeigersinn ab oben */
const COLORS = ["#f03a3a","#fdd835","#3fd9e6","#9b19f5","#1a35c4","#fb923c","#2f5d5d","#0fbf5f"];
const colorOf = i => COLORS[i % COLORS.length];   // bei mehr Sätzen als Farben wiederholen sich die Farben
/* ========================================================== */

const $ = s => document.querySelector(s);
const stage = $("#stage"), cv = $("#fx"), ctx = cv.getContext("2d");
let W, H, dpr;
function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W*dpr; cv.height = H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize", resize); resize();

/* ---------- Ring (Logo-Anspielung) ---------- */
function ring(size, r, len, sw, extra=""){
  const c = size/2;
  let s = `<svg class="${extra}" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" aria-hidden="true">`;
  for(let i=0;i<N;i++){
    s += `<line data-i="${i}" x1="${c-len/2}" x2="${c+len/2}" y1="${c-r}" y2="${c-r}"
      stroke-width="${sw}" stroke-linecap="round"
      transform="rotate(${i*360/N} ${c} ${c})" style="--c:${colorOf(i)};--k:${i}"/>`;
  }
  return s + "</svg>";
}
$("#hud").innerHTML = ring(64, 24, 9, 3);
const introRingEl = $("#introRing");
introRingEl.innerHTML = ring(120, 48, 16, 5, "ringbig");
introRingEl.querySelectorAll("line").forEach(l => l.style.stroke = l.style.getPropertyValue("--c"));
$("#finRing").innerHTML = ring(190, 78, 26, 7, "ringbig");

/* ---------- Konfetti ---------- */
let parts = [], running = false;
function kick(){ if(!running){ running = true; requestAnimationFrame(loop); } }
function burst(x, y, color, n=26, power=1){
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, v = (2+Math.random()*7)*power;
    parts.push({x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v-2, g:.26,
      r:2.5+Math.random()*4, rot:Math.random()*6, vr:(Math.random()-.5)*.4,
      c: color || COLORS[(Math.random()*8)|0], life:1, decay:.012+Math.random()*.012,
      shape:Math.random()<.55?1:0});
  }
  kick();
}
function rain(count=140){
  for(let i=0;i<count;i++){
    parts.push({x:Math.random()*W, y:-20-Math.random()*H*.6, vx:(Math.random()-.5)*2, vy:1.5+Math.random()*3,
      g:.03, r:3+Math.random()*4, rot:Math.random()*6, vr:(Math.random()-.5)*.3,
      c:COLORS[(Math.random()*8)|0], life:1, decay:.002+Math.random()*.002, shape:Math.random()<.7?1:0});
  }
  kick();
}
function loop(){
  ctx.clearRect(0,0,W,H);
  for(const p of parts){
    p.vy += p.g; p.x += p.vx; p.y += p.vy; p.vx *= .992; p.rot += p.vr; p.life -= p.decay;
    ctx.save();
    ctx.globalAlpha = Math.max(p.life,0);
    ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle = p.c;
    if(p.shape) ctx.fillRect(-p.r, -p.r/2, p.r*2.2, p.r);
    else { ctx.beginPath(); ctx.arc(0,0,p.r*.7,0,7); ctx.fill(); }
    ctx.restore();
  }
  parts = parts.filter(p => p.life > 0 && p.y < H+30);
  if(parts.length) requestAnimationFrame(loop); else { running = false; ctx.clearRect(0,0,W,H); }
}

/* ---------- Plopp ---------- */
let ac;
function pop(){
  try{
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const len = ac.sampleRate*.14, buf = ac.createBuffer(1,len,ac.sampleRate), d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/len,4);
    const s = ac.createBufferSource(), g = ac.createGain();
    s.buffer = buf; g.gain.value = .45; s.connect(g); g.connect(ac.destination); s.start();
  }catch(e){}
}

/* ---------- Ballons ---------- */
let popped = 0;
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [a[i],a[j]]=[a[j],a[i]]; } return a; }

function spawnBalloons(){
  const cols = innerWidth < 620 ? 3 : 4, rows = Math.ceil(N/cols);
  const slots = shuffle([...Array(cols*rows).keys()]).slice(0, N);
  const size = Math.max(52, Math.min(100, Math.min(innerWidth, innerHeight)*.13, innerHeight*.46/rows/1.45));
  for(let i=0;i<N;i++){
    const slot = slots[i], col = slot%cols, row = (slot/cols)|0;
    const x = (col+.5)/cols*100 + (Math.random()-.5)*(36/cols);
    const y = 22 + (row+.5)/rows*(innerHeight<560?44:46) + (Math.random()-.5)*3;
    const b = document.createElement("button");
    b.className = "b";
    b.setAttribute("aria-label","Ballon "+(i+1)+" von "+N);
    b.style.cssText = `left:${x}%;top:${y}%;--c:${colorOf(i)};--s:${size}px;--d:${(Math.random()*.9).toFixed(2)}s;--bd:${(-Math.random()*4).toFixed(2)}s`;
    b.innerHTML = "<i></i>";
    b.addEventListener("click", e => { e.stopPropagation(); popBalloon(b, i); });
    stage.appendChild(b);
  }
}

function popBalloon(el, i){
  const r = el.querySelector("i").getBoundingClientRect();
  burst(r.left + r.width/2, r.top + r.height/2, colorOf(i), 30);
  burst(r.left + r.width/2, r.top + r.height/2, null, 8, .8);
  pop();
  el.remove();
  document.querySelector(`#hud line[data-i="${i}"]`).classList.add("on");
  document.querySelector(`#hud line[data-i="${i}"]`).style.stroke = colorOf(i);
  showMsg(WORDS[i], colorOf(i));
  $("#hint").style.opacity = 0;
  popped++;
  if(popped === N) setTimeout(finale, 2600);
}

function showMsg(text, color){
  const m = $("#msg");
  m.classList.remove("in"); void m.offsetWidth;
  m.innerHTML = `<span class="dash" style="--c:${color}"></span><p></p>`;
  m.querySelector("p").textContent = text;
  m.style.setProperty("--c", color);
  m.classList.add("in");
}

/* ---------- Ablauf ---------- */
$("#start").addEventListener("click", () => {
  pop(); // Audio freischalten
  $("#intro").classList.add("hide");
  $("#hud").classList.add("show");
  $("#hint").textContent = "Piks einen Ballon an";
  spawnBalloons();
});

function finale(){
  $("#msg").style.display = "none";
  $("#hud").classList.remove("show");
  $("#finale").classList.remove("hide");
  // Konfetti-Kanonen von links und rechts
  for(let k=0;k<6;k++) setTimeout(() => {
    burst(0, H*.75, null, 40, 1.9); burst(W, H*.75, null, 40, 1.9);
  }, k*350);
  setTimeout(() => rain(160), 600);
  setTimeout(() => rain(120), 3200);
}
$("#finale").addEventListener("click", e => {
  if(e.target.id === "again") return;
  burst(e.clientX, e.clientY, null, 44, 1.3); pop();
});
$("#again").addEventListener("click", () => location.reload());
</script>
</body>
</html>
